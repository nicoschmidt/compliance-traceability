name: Bug
description: Something behaves differently from what it should
labels: ["type:bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and context
      description: Version or commit, relevant state. Mind the hard rules in CLAUDE.md about what may not be pasted here.
