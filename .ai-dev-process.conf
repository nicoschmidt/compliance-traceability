# Project facts, read by scripts/process/ and by every session.
# Project-owned. Every repository of the project carries the same values, and
# a change to one is made in all of them. For one run, the environment
# variables PROJECT_OWNER and PROJECT_NUMBER override the board's values.

# The project board: its owner and its number (`gh project list --owner <owner>`).
board_owner=nicoschmidt
board_number=2

# The repository that holds the vision, the ADRs, the iterations and the epics.
# In a project of one repository, that repository itself.
home_repo=nicoschmidt/compliance-traceability-project

# The other repositories of the project, separated by spaces. Empty in a
# project of one repository. All of them are checked out beside each other.
member_repos=nicoschmidt/compliance-traceability nicoschmidt/compliance-traceability-private
