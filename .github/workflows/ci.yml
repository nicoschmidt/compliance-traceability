name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  process:
    name: Process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Managed files are unchanged
        run: bash scripts/process/check-kit.sh

      - name: Script syntax
        run: |
          failed=0
          for script in $(git ls-files 'scripts/*.sh' .githooks); do
            bash -n "$script" || { echo "::error file=$script::bash -n failed"; failed=1; }
          done
          exit "$failed"

      - name: Script tests
        run: |
          failed=0
          for test in $(git ls-files 'scripts/*.sh' | grep -E '(^|/)test-[^/]*\.sh$'); do
            echo "== $test"
            bash "$test" || { echo "::error file=$test::$test failed"; failed=1; }
          done
          exit "$failed"

  # The public catalogue and code only: CI has no private packs.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev,web]'

      - name: Tests
        run: pytest

      - name: Catalogue release check
        run: python check_catalogue.py catalogue

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

  # The one check the main ruleset requires. Every other job is listed in
  # `needs`, so adding a job never means touching the repository settings.
  ci-passed:
    name: CI passed
    # Without always(), a failed job would skip this one, and a skipped
    # required check counts as passed.
    if: always()
    needs: [process, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "Not every job succeeded: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "every job succeeded"
